<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Proyectos — Pricing & BI Cemaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --verde:#1BA85D; --verde-bg:#D9F4E8;
    --azul:#101E8E; --azul-bg:#F0EFFA;
    --ambar:#C8970A; --ambar-bg:#FEF8E0;
    --gris:#C8C6BF; --gris-bg:#EEEDEA;
    --pausa:#4B5BB8; --pausa-bg:#ECEEF9;
    --text:#1A1D29; --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;margin:0;background:#F7F8FA;color:var(--text);}
  .topbar{background:var(--azul);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;}
  .logo{width:40px;height:40px;border-radius:10px;background:#FF7A1A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;}
  .topbar .sub{font-size:12px;opacity:.8;}
  .container{max-width:1200px;margin:0 auto;padding:28px;}
  .summary{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;margin-bottom:26px;}
  .panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .panel h2{font-size:15px;margin:0 0 14px;}
  .chart-wrap{position:relative;height:220px;}
  .big-num{font-size:40px;font-weight:800;color:var(--azul);}
  .big-label{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #F0F0F0;}
  .stat-row:last-child{border-bottom:none;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{border:1px solid var(--gris);background:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .filter-btn.active{background:var(--azul);color:#fff;border-color:var(--azul);}
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
  .proj-card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:12px;}
  .proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .proj-num{font-size:12px;color:var(--muted);font-weight:700;}
  .proj-name{font-size:15px;font-weight:700;line-height:1.3;}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;white-space:nowrap;}
  .badge.Completado{background:var(--verde-bg);color:var(--verde);}
  .badge.EnProceso{background:var(--ambar-bg);color:var(--ambar);}
  .badge.EnPausa{background:var(--pausa-bg);color:var(--pausa);}
  .badge.Pendiente{background:var(--gris-bg);color:#8A857C;}
  .progbar{width:100%;height:8px;background:var(--gris-bg);border-radius:5px;overflow:hidden;}
  .progbar span{display:block;height:100%;}
  .proj-bottom{display:flex;justify-content:space-between;align-items:center;}
  .pct{font-size:13px;font-weight:700;color:var(--muted);}
  .view-btn{background:var(--azul);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;}
  .view-btn:hover{background:#0c1670;}
  .closed-badge{background:var(--verde-bg);color:var(--verde);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:8px;text-align:center;}
  .no-dash{font-size:12px;color:var(--muted);font-style:italic;}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">C</div>
  <div>
    <h1>Portal de Proyectos</h1>
    <div class="sub">Cemaco Guatemala · Responsable: Erick Lopez</div>
  </div>
</div>

<div class="container">
  <div class="summary">
    <div class="panel">
      <h2>Avance general del portal</h2>
      <div class="big-num" id="avg-pct">0%</div>
      <div class="big-label">Promedio de avance (12 proyectos)</div>
      <div class="stat-row"><span><span class="dot" style="background:#1BA85D"></span>Completados</span><span id="s-completado">0</span></div>
      <div class="stat-row"><span><span class="dot" style="background:#C8970A"></span>En proceso</span><span id="s-proceso">0</span></div>
      <div class="stat-row"><span><span class="dot" style="background:#4B5BB8"></span>En pausa</span><span id="s-pausa">0</span></div>
      <div class="stat-row"><span><span class="dot" style="background:#C8C6BF"></span>Pendientes de priorizar</span><span id="s-pendiente">0</span></div>
    </div>
    <div class="panel">
      <h2>Distribución por estado</h2>
      <div class="chart-wrap"><canvas id="donut"></canvas></div>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="proj-grid" id="proj-grid"></div>
</div>

<footer id="footer"></footer>

<script>
const projects = [
  {num:"01", name:"Dashboard OTB en Power BI", estado:"En Proceso", pct:94, dash:"dashboard_otb_v2.html"},
  {num:"02", name:"Bloqueo de SKUs Descontinuados", estado:"En Proceso", pct:91, dash:"dashboard_bloqueo_skus.html"},
  {num:"03", name:"Validar Pronósticos LAMBDA", estado:"En Proceso", pct:88, dash:"dashboard_lambda.html"},
  {num:"11", name:"Validación Precios por Volumen SAE", estado:"En Proceso", pct:null, dash:"dashboard_validacion_sae.html", note:"Diagnóstico en curso"},
  {num:"12", name:"Configuración MRP: Material de Empaque", estado:"En Proceso", pct:86, dash:"dashboard_mrp_empaque.html"},
  {num:"08", name:"Planeación Agregada", estado:"Pendiente", pct:null, dash:null},
  {num:"09", name:"Agente de OTB", estado:"Pendiente", pct:null, dash:null},
  {num:"04", name:"Habilitación del Tablero de Elasticidad", estado:"En Pausa", pct:80, dash:"dashboard_elasticidad.html"},
  {num:"05", name:"Precio por Volumen", estado:"Completado", pct:100, dash:"dashboard_precio_volumen.html"},
  {num:"06", name:"Material de Empaque", estado:"Completado", pct:100, dash:null},
  {num:"07", name:"Liquidaciones", estado:"Completado", pct:100, dash:null},
  {num:"10", name:"Planificación Empaque Navidad", estado:"Completado", pct:100, dash:"dashboard_empaque_navidad.html"}
];

const estColors = {Completado:"#1BA85D","En Proceso":"#C8970A","En Pausa":"#4B5BB8",Pendiente:"#C8C6BF"};
let activeFilter = "Todos";

function render(){
  const completado = projects.filter(p=>p.estado==="Completado").length;
  const proceso = projects.filter(p=>p.estado==="En Proceso").length;
  const pausa = projects.filter(p=>p.estado==="En Pausa").length;
  const pendiente = projects.filter(p=>p.estado==="Pendiente").length;

  const withPct = projects.map(p=>p.pct===null?0:p.pct);
  const avg = Math.round(withPct.reduce((a,b)=>a+b,0)/projects.length);

  document.getElementById('avg-pct').textContent = avg+'%';
  document.getElementById('s-completado').textContent = completado;
  document.getElementById('s-proceso').textContent = proceso;
  document.getElementById('s-pausa').textContent = pausa;
  document.getElementById('s-pendiente').textContent = pendiente;

  const filterBtns = ["Todos","En Proceso","Completado","En Pausa","Pendiente"];
  document.getElementById('filters').innerHTML = filterBtns.map(f=>
    `<button class="filter-btn ${f===activeFilter?'active':''}" data-f="${f}">${f}</button>`
  ).join('');
  document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.f; render();});

  const shown = activeFilter==="Todos" ? projects : projects.filter(p=>p.estado===activeFilter);
  document.getElementById('proj-grid').innerHTML = shown.map(p=>{
    const badgeClass = p.estado.replace(' ','');
    let bottom;
    if(p.estado==="Completado"){
      bottom = p.dash
        ? `<div class="proj-bottom"><span class="closed-badge">Cerrado</span><a class="view-btn" href="${p.dash}">Ver dashboard</a></div>`
        : `<div class="proj-bottom"><span class="pct">100%</span><span class="closed-badge">Cerrado</span></div>`;
    } else if(p.dash===null){
      bottom = `<div class="proj-bottom"><span class="pct">${p.note?p.note:'Sin avance numérico'}</span><span class="no-dash">Sin dashboard — pendiente de priorizar</span></div>`;
    } else {
      const pctLabel = p.pct===null ? (p.note||'—') : p.pct+'%';
      bottom = `<div class="proj-bottom"><span class="pct">${pctLabel}</span><a class="view-btn" href="${p.dash}">Ver dashboard</a></div>`;
    }
    const progWidth = p.pct===null? 0 : p.pct;
    return `<div class="proj-card">
      <div class="proj-top">
        <div><div class="proj-num">Proyecto ${p.num}</div><div class="proj-name">${p.name}</div></div>
        <span class="badge ${badgeClass}">${p.estado}</span>
      </div>
      <div class="progbar"><span style="width:${progWidth}%;background:${estColors[p.estado]}"></span></div>
      ${bottom}
    </div>`;
  }).join('');
}

new Chart(document.getElementById('donut'), {
  type: 'doughnut',
  data: {
    labels: ['Completado','En Proceso','En Pausa','Pendiente'],
    datasets: [{
      data: [
        projects.filter(p=>p.estado==="Completado").length,
        projects.filter(p=>p.estado==="En Proceso").length,
        projects.filter(p=>p.estado==="En Pausa").length,
        projects.filter(p=>p.estado==="Pendiente").length
      ],
      backgroundColor: ['#1BA85D','#C8970A','#4B5BB8','#C8C6BF'],
      borderWidth: 0
    }]
  },
  options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{family:'DM Sans'}}}} }
});

document.getElementById('footer').textContent = `Portal generado automáticamente el ${new Date().toLocaleDateString('es-GT',{day:'numeric',month:'long',year:'numeric'})} · 12 proyectos activos`;

render();
</script>
</body>
</html>
